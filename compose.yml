services:
  # MariaDB Service
  mariadb:
    image: mariadb:latest
    # restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: courses
    ports:
      - "9906:3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - php-mariadb-network

  # PHP Service
  php:
    # image: php:8.2-apache
    container_name: php-apache
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mariadb
    volumes:
      - ./app/src:/var/www/html
    ports:
      - "8112:80"
    networks:
      - php-mariadb-network


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - '8113:80'
    environment:
      PMA_HOST: mariadb
    depends_on:
      - mariadb
    networks:
      - php-mariadb-network

networks:
  php-mariadb-network:

volumes:
  mariadb:


